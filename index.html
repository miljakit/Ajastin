<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajastin</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <label for="aktiivijakso">Aseta aktiivijakso:</label>
    <select name="aktiivijakso" id="aktiivijakso">
        <option value="30">0,5 min</option>
        <option value="60">1 min</option>
        <option value="90">1,5 min</option>
        <option value="120">2 min</option>
        <option value="150">2,5 min</option>
        <option value="180">3 min</option>
        <option value="240">4 min</option>
        <option value="300">5 min</option>
    </select>
    <label for="modifioitu_aktiivijakso">Modifioitu (sekunteina):</label>
    <input type="text" id="modifioitu_aktiivijakso">
    <br>

    <label for="passiivijakso">Aseta passiivijakso:</label>
    <select name="passiivijakso" id="passiivijakso">
        <option value="30">0,5 min</option>
        <option value="60">1 min</option>
        <option value="90">1,5 min</option>
        <option value="120">2 min</option>
        <option value="150">2,5 min</option>
        <option value="180">3 min</option>
        <option value="240">4 min</option>
        <option value="300">5 min</option>
    </select>
    <label for="modifioitu_passiivijakso">Modifioitu (sekunteina):</label>
    <input type="text" id="modifioitu_passiivijakso">
    <br>

    <label for="kierrokset">Kierrokset:</label>
    <select name="kierrokset" id="kierrokset">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
    </select>
    <label for="modifioitu_kierrokset">Modifioitu:</label>
    <input type="text" id="modifioitu_kierrokset">
    <br>
    <br>
    
    <div id="ajastin-naytto">00:00</div>
    <button id="kaynnistysbutton" onclick="kaynnistaAjastin()">Käynnistä</button>
    <br>
    <br>

    <table id="toteutuneet_jaksot" style="width:100%">
        <tr>
            <th>Jakso</th>
            <th>Alku</th>
            <th>Loppu</th>
        </tr>
    </table>

    <script>
        const selectAktiivijakso = document.getElementById("aktiivijakso");
        const selectPassiivijakso = document.getElementById("passiivijakso");
        const selectKierrokset = document.getElementById("kierrokset");

        const inputAktiivijakso = document.getElementById("modifioitu_aktiivijakso");
        const inputPassiivijakso = document.getElementById("modifioitu_passiivijakso");
        const inputKierrokset = document.getElementById("modifioitu_kierrokset");

        // Select disabled kun modifioitu arvo kirjataan
        inputAktiivijakso.addEventListener("input", function () {
            selectAktiivijakso.disabled = inputAktiivijakso.value.trim() !== "";
        });

        inputPassiivijakso.addEventListener("input", function () {
            selectPassiivijakso.disabled = inputPassiivijakso.value.trim() !== "";
        });

        inputKierrokset.addEventListener("input", function () {
            selectKierrokset.disabled = inputKierrokset.value.trim() !== "";
        });

    </script>

</body>

</html>
